server {
    listen 80;
    server_name localhost;

    resolver 127.0.0.11 ipv6=off valid=10s;
    client_max_body_size 10M;

    # Empêche Nginx de forcer "http://" lors des redirections 301
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Sécurité
    autoindex off;


    #######################################
    # Blocage accès aux sources frontend
    #######################################

    location /src/components/ {
        deny all;
        return 403;
    }

    location /src/js/ {
        deny all;
        return 403;
    }

    location /src/css/ {
        deny all;
        return 403;
    }


    #######################################
    # API FastAPI
    #######################################

    location = /api {
        return 301 /api/;
    }

    location ^~ /api/ {
        proxy_pass http://selftierlist-fastapi:8000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Transmet le protocole HTTPS envoyé par Cloudflare
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Prefix /api;

        proxy_redirect off;
    }


    #######################################
    # Nettoyage des URLs .html (Canonical)
    #######################################

    # 1. Rediriger /index.html -> / (uniquement si tapé explicitement dans la barre d'adresse)
    if ($request_uri ~ ^/index\.html(\?.*)?$) {
        return 301 /$is_args$args;
    }

    # 2. Rediriger /page.html -> /page (uniquement si tapé explicitement dans la barre d'adresse)
    if ($request_uri ~ ^/(.+)\.html(\?.*)?$) {
        return 301 /$1$is_args$args;
    }


    #######################################
    # Routage fichiers frontend
    #######################################

    location / {

        # Cherche :
        # 1. fichier exact (/style.css)
        # 2. dossier (/assets/)
        # 3. fichier html sans extension (/tierlist -> tierlist.html)
        try_files $uri $uri/ $uri.html =404;
    }


    #######################################
    # Gestion erreurs
    #######################################

    error_page 400 401 402 403 404 405 406 407 408 409 410 411 412 413 414 415 416 417 418 419 420 421 422 423 424 425 426 429 431 444 450 451 495 496 497 498 500 501 502 503 504 506 507 508 510 511 521 522 523 525 530 599 /error;


    location = /error {
        root /var/www/error/;

        try_files /$status.html /unknown.html;

        internal;
    }
}