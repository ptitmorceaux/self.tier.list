<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tier List - Créez et Partagez vos Listes</title>
  <link rel="stylesheet" href="assets/css/style.css?v=1.0">
</head>
<body>
  <nav class="navbar"></nav>

  <div class="page">
    <div class="container">
      <div class="hero">
        <h1>✨ Créez vos Tier Lists</h1>
        <p>
          Classez vos éléments préférés facilement et partagez-les avec la communauté
        </p>
      </div>

      <div style="margin-bottom: 60px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 15px;">
          <h2 style="font-size: 24px; font-weight: 800; margin: 0;">🌟 Tier Lists Populaires</h2>
          <div style="flex: 1; max-width: 400px; min-width: 250px;">
            <input type="text" id="search-input" class="form-control" placeholder="🔍 Rechercher par titre ou description..." style="width: 100%;">
          </div>
          <div id="refresh-container"></div>
        </div>

        <!-- Barre de filtres et tris -->
        <div id="filters-container" style="display: flex; gap: 15px; margin-bottom: 32px; flex-wrap: wrap; background: white; padding: 15px; border-radius: var(--radius); border: 1px solid var(--border);">
          <div style="flex: 1; min-width: 150px;">
            <label style="font-size: 12px; margin-bottom: 4px; font-weight: 600;">Trier par :</label>
            <select id="sort-date" class="form-control" style="padding: 8px;">
              <option value="desc">Plus récentes (Modification)</option>
              <option value="asc">Plus anciennes (Modification)</option>
            </select>
          </div>
          <div style="flex: 1; min-width: 150px;">
            <label style="font-size: 12px; margin-bottom: 4px; font-weight: 600;">Date précise (Création) :</label>
            <input type="date" id="filter-date" class="form-control" style="padding: 8px;">
          </div>
          <div style="flex: 1; min-width: 150px;">
            <label style="font-size: 12px; margin-bottom: 4px; font-weight: 600;">Auteur :</label>
            <input type="text" id="filter-author" class="form-control" placeholder="Ex: Pseudopabo" style="padding: 8px;">
          </div>
        </div>
        
        <div id="tierlists-container" class="grid">
          <!-- Les tier lists seront chargées ici -->
        </div>
        <div id="empty-state" style="text-align: center; padding: 80px 20px; color: var(--text-light);">
          <div style="margin-bottom: 20px; font-size: 48px;">🎯</div>
          <p style="font-size: 18px; margin-bottom: 20px; font-weight: 600;">Aucune tier list disponible</p>
          <p style="margin-bottom: 30px;">Connectez-vous pour découvrir et créer vos tier lists !</p>
          <a href="login.html" class="btn btn-primary">Se connecter</a>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/config.js?v=1.0"></script>
  <script src="assets/js/api.js?v=1.0"></script>
  <script src="assets/js/ui.js?v=1.0"></script>
  <script src="assets/js/pages/index.js?v=1.0"></script>
</body>
</html>
