<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="assets/img/favicon.ico">
  <title>Mon Profil</title>
  <link rel="stylesheet" href="assets/css/style.css?v=1.0">
</head>
<body>
  <nav class="navbar"></nav>

  <div class="page">
    <div class="container">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; margin-top: 30px; flex-wrap: wrap; gap: 15px;">
        <div>
          <h1 style="font-size: 32px; font-weight: 800; margin-bottom: 8px;">📚 Mes Tier Lists</h1>
          <p style="color: var(--text-light);">Gérez et partagez vos créations</p>
        </div>
        <div style="flex: 1; max-width: 400px; min-width: 250px;">
          <input type="text" id="search-input" class="form-control" placeholder="🔍 Rechercher dans mes tier lists..." style="width: 100%;">
        </div>
        <button id="new-tierlist-btn" class="btn btn-primary">+ Nouvelle Tier List</button>
      </div>

      <!-- Barre de filtres et tris -->
      <div id="filters-container" style="display: flex; gap: 15px; margin-bottom: 40px; flex-wrap: wrap; background: white; padding: 15px; border-radius: var(--radius); border: 1px solid var(--border);">
        <div style="flex: 1; min-width: 200px;">
          <label style="font-size: 12px; margin-bottom: 4px; font-weight: 600;">Trier par :</label>
          <select id="sort-date" class="form-control" style="padding: 8px;">
            <option value="desc">Dernière modification</option>
            <option value="asc">Ancienne modification</option>
          </select>
        </div>
        <div style="flex: 1; min-width: 200px;">
          <label style="font-size: 12px; margin-bottom: 4px; font-weight: 600;">Créée à la date précise :</label>
          <input type="date" id="filter-date" class="form-control" style="padding: 8px;">
        </div>
      </div>

      <div id="tierlists-container" class="grid">
        <!-- Les tier lists seront chargées ici -->
      </div>

      <div id="empty-state" style="text-align: center; padding: 80px 20px; color: var(--text-light);">
        <div style="font-size: 64px; margin-bottom: 20px;">🚀</div>
        <p style="font-size: 18px; margin-bottom: 10px; font-weight: 600;">Vous n'avez pas encore de tier list</p>
        <p style="margin-bottom: 30px;">Créez votre première tier list et commencez à classer vos éléments préférés !</p>
        <button id="empty-new-btn" class="btn btn-primary">Créer une Tier List</button>
      </div>
    </div>
  </div>

  <script src="assets/js/config.js?v=1.0"></script>
  <script src="assets/js/api.js?v=1.0"></script>
  <script src="assets/js/ui.js?v=1.0"></script>
  <script src="assets/js/pages/profile.js?v=1.0"></script>
</body>
</html>
