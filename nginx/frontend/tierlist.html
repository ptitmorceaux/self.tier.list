<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tier List</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <nav class="navbar"></nav>

  <div class="page">
    <div class="container">
      <div class="tierlist-editor">

        <!-- Mode lecture (visiteur) -->
        <div id="viewer-mode" class="viewer-only">
          <div class="tierlist-header">
            <h1 id="viewer-title"></h1>
            <p id="viewer-description" style="color: var(--text-light); font-size: 16px; margin-top: 8px;"></p>
            <p id="viewer-creator" style="font-size: 13px; color: var(--text-lighter); margin-top: 12px; display: flex; align-items: center; gap: 6px;"></p>
          </div>
          <div id="viewer-actions" class="controls"></div>
          <div id="viewer-tierlist" class="tierlist-container"></div>
        </div>

        <!-- Mode édition / création (propriétaire) -->
        <div id="editor-mode" class="editor-only">
          
          <!-- SECTION 1 : Titre & Description (Seule section visible à la création) -->
          <div class="card mb-20" style="padding: 24px; border: 1px solid var(--border);">
            <h3 id="meta-section-title" style="margin-bottom: 20px; font-size: 20px; font-weight: 700;">🆕 Créer une nouvelle Tier List</h3>
            
            <div class="form-group mb-15">
              <label for="title-input">Titre de la Tier List *</label>
              <input type="text" id="title-input" class="form-control" placeholder="Ex: Les meilleurs jeux vidéo 2026" required>
            </div>
            
            <div class="form-group mb-20">
              <label for="description-input">Description (optionnelle)</label>
              <textarea id="description-input" class="form-control" placeholder="Ajoutez quelques détails..." style="min-height: 80px;"></textarea>
            </div>

            <button id="save-meta-btn" class="btn btn-primary">Créer la Tier List</button>
          </div>

          <!-- SECTIONS INTERACTIVES (Affichées uniquement quand la Tier List existe en BDD) -->
          <div id="tierlist-content-sections" style="display: none;">
            
            <!-- Visibilité & Contrôles globaux -->
            <div class="card mb-20" style="padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; background: var(--light);">
              <div style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600;">
                <span>🔒 Visibilité :</span>
                <select id="privacy-select" style="width: auto; padding: 6px 12px;">
                  <option value="false">🌐 Publique</option>
                  <option value="true">🔒 Privée</option>
                </select>
              </div>

              <div class="controls" style="margin: 0;">
                <button id="reset-btn" class="btn btn-warning btn-sm">🔄 Réinitialiser les rangs</button>
                <button id="delete-btn" class="btn btn-danger btn-sm">🗑️ Supprimer cette tier list</button>
              </div>
            </div>

            <!-- Zone d'upload d'images -->
            <div class="image-upload mb-30" id="image-upload-zone">
              <input type="file" id="image-input" accept="image/*" multiple>
              <div style="pointer-events: none;">
                <p style="font-size: 32px; margin-bottom: 8px;">📁</p>
                <p style="font-weight: 600; font-size: 16px; margin-bottom: 4px;">Glissez-déposez vos images ici</p>
                <p style="font-size: 13px; color: var(--text-light);">ou cliquez pour sélectionner (PNG, JPG, WebP — Max 5 MB)</p>
              </div>
            </div>

            <!-- Grille des rangs (S, A, B...) -->
            <div class="tierlist-container mb-30" id="tierlist-editor-container"></div>

            <!-- Images en attente (_blank) -->
            <div class="images-pool" id="unclassified-section">
              <h4>📦 Images en attente de classement</h4>
              <div class="images-grid" id="images-grid"></div>
            </div>

          </div>

        </div>

      </div>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/pages/tierlist.js"></script>
</body>
</html>
